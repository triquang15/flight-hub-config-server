server:
  port: 8091

spring:
  datasource:
    url: ${NOTIFICATION_DATASOURCE_URL:jdbc:postgresql://localhost:5432/airline_notification_db}
    username: ${NOTIFICATION_DATASOURCE_USERNAME:${FLIGHTHUB_DATASOURCE_USERNAME:postgres}}
    password: ${NOTIFICATION_DATASOURCE_PASSWORD:${FLIGHTHUB_DATASOURCE_PASSWORD:12345678}}
    driver-class-name: ${NOTIFICATION_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

  data:
    redis:
      host: ${NOTIFICATION_REDIS_HOST:${SPRING_DATA_REDIS_HOST:localhost}}
      port: ${NOTIFICATION_REDIS_PORT:${SPRING_DATA_REDIS_PORT:6379}}
      timeout: ${NOTIFICATION_REDIS_TIMEOUT:2000ms}
      lettuce:
        pool:
          max-active: ${NOTIFICATION_REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${NOTIFICATION_REDIS_POOL_MAX_IDLE:4}
          min-idle: ${NOTIFICATION_REDIS_POOL_MIN_IDLE:1}

  kafka:
    bootstrap-servers: ${NOTIFICATION_KAFKA_BOOTSTRAP_SERVERS:${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    consumer:
      group-id: ${NOTIFICATION_KAFKA_CONSUMER_GROUP_ID:notification-service-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.triquang.message
        spring.json.use.type.headers: true
        max.poll.interval.ms: 300000
        session.timeout.ms: 15000
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        linger.ms: 5
        batch.size: 16384
    listener:
      ack-mode: record
      concurrency: ${NOTIFICATION_KAFKA_LISTENER_CONCURRENCY:3}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:flight.hub015@gmail.com}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        debug: ${MAIL_DEBUG:false}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}
  enabled: ${TWILIO_ENABLED:false}

notification:
  from-email: ${MAIL_FROM:flight.hub015@gmail.com}
  from-name: ${NOTIFICATION_FROM_NAME:Flight Hub Notifications}
  support-email: ${MAIL_FROM:flight.hub015@gmail.com}
  support-phone: ${NOTIFICATION_SUPPORT_PHONE:1800-123-5678}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  password-reset-url: ${PASSWORD_RESET_URL:${notification.frontend-base-url}/reset-password}
  checkin-url: ${NOTIFICATION_CHECKIN_URL:${notification.frontend-base-url}/checkin}
  manage-booking-url: ${NOTIFICATION_MANAGE_BOOKING_URL:${notification.frontend-base-url}/booking}
  idempotency:
    retention-seconds: ${NOTIFICATION_IDEMPOTENCY_RETENTION_SECONDS:86400}
    processing-lock-seconds: ${NOTIFICATION_IDEMPOTENCY_LOCK_SECONDS:300}

kafka:
  topics:
    booking-confirmed: ${KAFKA_TOPIC_BOOKING_CONFIRMED:booking.confirmed}
    booking-confirmed-dlq: ${KAFKA_TOPIC_BOOKING_CONFIRMED_DLQ:booking.confirmed.DLQ}
    password-reset-requested: ${KAFKA_TOPIC_PASSWORD_RESET_REQUESTED:user.password-reset-requested}
    password-reset-requested-dlq: ${KAFKA_TOPIC_PASSWORD_RESET_REQUESTED_DLQ:user.password-reset-requested.DLQ}
    suspicious-login: ${KAFKA_TOPIC_SUSPICIOUS_LOGIN:security.suspicious-login}
    suspicious-login-dlq: ${KAFKA_TOPIC_SUSPICIOUS_LOGIN_DLQ:security.suspicious-login.DLQ}
  groups:
    notification-dlq: ${NOTIFICATION_KAFKA_DLQ_GROUP_ID:notification-dlq-group}
