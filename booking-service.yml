server:
  port: 8083

spring:
  datasource:
    url: ${BOOKING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/airline_booking_db}
    username: ${BOOKING_DATASOURCE_USERNAME:${FLIGHTHUB_DATASOURCE_USERNAME:postgres}}
    password: ${BOOKING_DATASOURCE_PASSWORD:${FLIGHTHUB_DATASOURCE_PASSWORD:12345678}}
    driver-class-name: ${BOOKING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

  kafka:
    bootstrap-servers: ${BOOKING_KAFKA_BOOTSTRAP_SERVERS:${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    consumer:
      group-id: ${BOOKING_KAFKA_CONSUMER_GROUP_ID:booking-service-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.triquang.message
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        linger.ms: 5
        batch.size: 16384
    listener:
      ack-mode: record
      concurrency: ${BOOKING_KAFKA_LISTENER_CONCURRENCY:2}

kafka:
  topics:
    payment-completed: ${KAFKA_TOPIC_PAYMENT_COMPLETED:payment.completed}
    payment-failed: ${KAFKA_TOPIC_PAYMENT_FAILED:payment.failed}
    payment-refunded: ${KAFKA_TOPIC_PAYMENT_REFUNDED:payment.refunded}
    booking-confirmed: ${KAFKA_TOPIC_BOOKING_CONFIRMED:booking.confirmed}
    payment-completed-dlq: ${KAFKA_TOPIC_PAYMENT_COMPLETED_DLQ:payment.completed.DLQ}
    payment-failed-dlq: ${KAFKA_TOPIC_PAYMENT_FAILED_DLQ:payment.failed.DLQ}
    payment-refunded-dlq: ${KAFKA_TOPIC_PAYMENT_REFUNDED_DLQ:payment.refunded.DLQ}
