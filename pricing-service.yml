server:
  port: 8087

spring:
  datasource:
    url: ${PRICING_DATASOURCE_URL}
    username: ${PRICING_DATASOURCE_USERNAME:${FLIGHTHUB_DATASOURCE_USERNAME}}
    password: ${PRICING_DATASOURCE_PASSWORD:${FLIGHTHUB_DATASOURCE_PASSWORD}}
    driver-class-name: ${PRICING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
