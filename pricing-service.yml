server:
  port: 8087

spring:
  datasource:
    url: ${PRICING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/airline_pricing_db}
    username: ${PRICING_DATASOURCE_USERNAME:${FLIGHTHUB_DATASOURCE_USERNAME:postgres}}
    password: ${PRICING_DATASOURCE_PASSWORD:${FLIGHTHUB_DATASOURCE_PASSWORD:12345678}}
    driver-class-name: ${PRICING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  data:
    redis:
      host: ${PRICING_REDIS_HOST:${SPRING_DATA_REDIS_HOST:localhost}}
      port: ${PRICING_REDIS_PORT:${SPRING_DATA_REDIS_PORT:6379}}
      timeout: ${PRICING_REDIS_TIMEOUT:2000ms}
      lettuce:
        pool:
          max-active: ${PRICING_REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${PRICING_REDIS_POOL_MAX_IDLE:4}
          min-idle: ${PRICING_REDIS_POOL_MIN_IDLE:1}
  cache:
    type: redis
