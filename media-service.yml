server:
  port: 8089

spring:
  datasource:
    url: ${MEDIA_DATASOURCE_URL:jdbc:postgresql://localhost:5441/media_service_db}
    username: ${MEDIA_DATASOURCE_USERNAME:${FLIGHTHUB_DATASOURCE_USERNAME:postgres}}
    password: ${MEDIA_DATASOURCE_PASSWORD:${FLIGHTHUB_DATASOURCE_PASSWORD:12345678}}
    driver-class-name: ${MEDIA_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

app:
  media:
    storage-path: ${MEDIA_STORAGE_PATH:uploads/media}
    storage-provider: ${MEDIA_STORAGE_PROVIDER:LOCAL}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:8080}
    max-file-size-bytes: ${MEDIA_MAX_FILE_SIZE_BYTES:8388608}
    s3:
      bucket: ${MEDIA_S3_BUCKET:}
      region: ${MEDIA_S3_REGION:us-east-1}
      public-base-url: ${MEDIA_S3_PUBLIC_BASE_URL:}
      endpoint: ${MEDIA_S3_ENDPOINT:}
      path-style-access: ${MEDIA_S3_PATH_STYLE_ACCESS:false}
      access-key-id: ${MEDIA_S3_ACCESS_KEY_ID:}
      secret-access-key: ${MEDIA_S3_SECRET_ACCESS_KEY:}
