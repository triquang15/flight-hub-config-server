server:
  port: 8086

spring:
  datasource:
    url: ${PAYMENT_DATASOURCE_URL:jdbc:postgresql://localhost:5432/airline_payment_db}
    username: ${PAYMENT_DATASOURCE_USERNAME:${FLIGHTHUB_DATASOURCE_USERNAME:postgres}}
    password: ${PAYMENT_DATASOURCE_PASSWORD:${FLIGHTHUB_DATASOURCE_PASSWORD:12345678}}
    driver-class-name: ${PAYMENT_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

  kafka:
    bootstrap-servers: ${PAYMENT_KAFKA_BOOTSTRAP_SERVERS:${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        linger.ms: 5
        batch.size: 16384

payment:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
  paypal:
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}

kafka:
  topics:
    payment-completed: ${KAFKA_TOPIC_PAYMENT_COMPLETED:payment.completed}
    payment-failed: ${KAFKA_TOPIC_PAYMENT_FAILED:payment.failed}
    payment-refunded: ${KAFKA_TOPIC_PAYMENT_REFUNDED:payment.refunded}
