server:
  port: 8081

spring:
  datasource:
    url: ${AIRLINE_CORE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/airline_core_db}
    username: ${AIRLINE_CORE_DATASOURCE_USERNAME:${FLIGHTHUB_DATASOURCE_USERNAME:postgres}}
    password: ${AIRLINE_CORE_DATASOURCE_PASSWORD:${FLIGHTHUB_DATASOURCE_PASSWORD:12345678}}
    driver-class-name: ${AIRLINE_CORE_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  data:
    redis:
      host: ${AIRLINE_CORE_REDIS_HOST:${SPRING_DATA_REDIS_HOST:localhost}}
      port: ${AIRLINE_CORE_REDIS_PORT:${SPRING_DATA_REDIS_PORT:6379}}
      timeout: ${AIRLINE_CORE_REDIS_TIMEOUT:2000ms}
      lettuce:
        pool:
          max-active: ${AIRLINE_CORE_REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${AIRLINE_CORE_REDIS_POOL_MAX_IDLE:4}
          min-idle: ${AIRLINE_CORE_REDIS_POOL_MIN_IDLE:1}
  cache:
    type: redis

  kafka:
    bootstrap-servers: ${AIRLINE_CORE_KAFKA_BOOTSTRAP_SERVERS:${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        spring.json.add.type.headers: true
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        linger.ms: 5
        batch.size: 16384

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  media-service:
    base-url: ${MEDIA_SERVICE_BASE_URL:http://localhost:8089}

kafka:
  topics:
    airline-onboarding-decision: ${KAFKA_TOPIC_AIRLINE_ONBOARDING_DECISION:airline.onboarding-decision}
