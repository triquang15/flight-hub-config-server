server:
  port: 8088

spring:
  datasource:
    url: ${SEAT_DATASOURCE_URL:jdbc:postgresql://localhost:5432/airline_seat_db}
    username: ${SEAT_DATASOURCE_USERNAME:${FLIGHTHUB_DATASOURCE_USERNAME:postgres}}
    password: ${SEAT_DATASOURCE_PASSWORD:${FLIGHTHUB_DATASOURCE_PASSWORD:12345678}}
    driver-class-name: ${SEAT_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

  kafka:
    bootstrap-servers: ${SEAT_KAFKA_BOOTSTRAP_SERVERS:${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    consumer:
      group-id: ${SEAT_KAFKA_CONSUMER_GROUP_ID:seat-service-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.triquang.message
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        linger.ms: 5
        batch.size: 16384
    listener:
      ack-mode: record
      concurrency: ${SEAT_KAFKA_LISTENER_CONCURRENCY:2}

kafka:
  topics:
    flight-instance-created: ${KAFKA_TOPIC_FLIGHT_INSTANCE_CREATED:flight-instance-created}
    booking-confirmed: ${KAFKA_TOPIC_BOOKING_CONFIRMED:booking.confirmed}
    flight-instance-created-dlq: ${KAFKA_TOPIC_FLIGHT_INSTANCE_CREATED_DLQ:flight-instance-created.DLQ}
    booking-confirmed-dlq: ${KAFKA_TOPIC_BOOKING_CONFIRMED_DLQ:booking.confirmed.DLQ}
