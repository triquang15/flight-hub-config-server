server:
  port: 8084

spring:
  datasource:
    url: ${FLIGHT_OPS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/airline_flight_db}
    username: ${FLIGHT_OPS_DATASOURCE_USERNAME:${FLIGHTHUB_DATASOURCE_USERNAME:postgres}}
    password: ${FLIGHT_OPS_DATASOURCE_PASSWORD:${FLIGHTHUB_DATASOURCE_PASSWORD:12345678}}
    driver-class-name: ${FLIGHT_OPS_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  data:
    redis:
      host: ${FLIGHT_OPS_REDIS_HOST:${SPRING_DATA_REDIS_HOST:localhost}}
      port: ${FLIGHT_OPS_REDIS_PORT:${SPRING_DATA_REDIS_PORT:6379}}
      timeout: ${FLIGHT_OPS_REDIS_TIMEOUT:2000ms}
      lettuce:
        pool:
          max-active: ${FLIGHT_OPS_REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${FLIGHT_OPS_REDIS_POOL_MAX_IDLE:4}
          min-idle: ${FLIGHT_OPS_REDIS_POOL_MIN_IDLE:1}
  cache:
    type: redis

  kafka:
    bootstrap-servers: ${FLIGHT_OPS_KAFKA_BOOTSTRAP_SERVERS:${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        linger.ms: 5
        batch.size: 16384

kafka:
  topics:
    flight-instance-created: ${KAFKA_TOPIC_FLIGHT_INSTANCE_CREATED:flight-instance-created}
